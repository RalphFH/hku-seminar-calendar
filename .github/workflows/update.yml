name: Update HKU seminar announcements
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seminar-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fetch public HKU announcements
        run: python3 collect.py --output data/calendar.json
      - name: Publish data snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public HKU seminar data'
            git push
          fi
